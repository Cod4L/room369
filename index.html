<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For Mon Cherry ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    /* ——— RESET & BASE ——— */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      background: #12080c;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      color: #fff;
      touch-action: none;
      user-select: none;
    }
    ::-webkit-scrollbar {
      width: 0;
      background: transparent;
    }

    /* ——— THREE.JS CANVAS ——— */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
    }

    /* ——— UI OVERLAY ——— */
    #ui-overlay {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    #ui-overlay>* {
      pointer-events: auto;
    }

    /* ——— LANDING GIFT BOX ——— */
    #landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
      background: rgba(18, 8, 12, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1), transform 1.2s cubic-bezier(0.23, 1, 0.32, 1);
    }
    #landing.hidden {
      opacity: 0;
      transform: scale(0.92) rotateY(15deg);
      pointer-events: none;
    }

    .gift-wrapper {
      perspective: 800px;
      cursor: pointer;
    }
    .gift-box {
      width: 150px;
      height: 150px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: float 3s ease-in-out infinite;
    }
    .gift-box:hover {
      transform: rotateY(8deg) rotateX(4deg) scale(1.04);
    }
    .gift-box:active {
      transform: scale(0.92);
    }
    .gift-box .box-body {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #ff4d6d, #d81b60);
      border-radius: 20px 20px 10px 10px;
      box-shadow: 0 30px 60px rgba(255, 77, 109, 0.5);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .gift-box .lid {
      position: absolute;
      top: -32px;
      left: -8px;
      width: calc(100% + 16px);
      height: 38px;
      background: linear-gradient(145deg, #ff1a4f, #c2185b);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -6px 20px rgba(255, 77, 109, 0.4);
      transform-origin: bottom center;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gift-box .ribbon-v {
      position: absolute;
      background: #fff;
      width: 18px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }
    .gift-box .ribbon-h {
      position: absolute;
      background: #fff;
      height: 18px;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 3px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }
    .gift-box .bow {
      position: absolute;
      top: -48px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 42px;
      filter: drop-shadow(0 10px 25px rgba(255, 255, 255, 0.5));
      animation: pulse 2s ease-in-out infinite;
      line-height: 1;
    }
    .gift-box .shine {
      position: absolute;
      top: 10%;
      left: 15%;
      width: 30%;
      height: 20%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-16px);
      }
    }
    @keyframes pulse {
      0%,
      100% {
        transform: translateX(-50%) scale(1);
      }
      50% {
        transform: translateX(-50%) scale(1.18);
      }
    }

    .tap-text {
      margin-top: 32px;
      font-size: 17px;
      color: #f8a4b8;
      letter-spacing: 2px;
      background: rgba(255, 255, 255, 0.07);
      padding: 12px 30px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .tap-text:active {
      transform: scale(0.95);
    }

    /* ——— MAIN CARD ——— */
    #main-card {
      display: none;
      max-width: 560px;
      width: 92%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border-radius: 48px;
      padding: 32px 28px 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 50px 100px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      transform-style: preserve-3d;
      transition: transform 0.08s ease;
      max-height: 90vh;
      overflow-y: auto;
      animation: cardAppear 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    @keyframes cardAppear {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.94);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    #main-card::-webkit-scrollbar {
      width: 0;
      background: transparent;
    }

    .card-header {
      text-align: center;
      margin-bottom: 18px;
    }
    .badge-day {
      display: inline-block;
      background: rgba(255, 77, 109, 0.25);
      backdrop-filter: blur(4px);
      padding: 6px 22px;
      border-radius: 60px;
      font-size: 13px;
      font-weight: 700;
      color: #ff8aa8;
      border: 1px solid rgba(255, 77, 109, 0.3);
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 54px;
      color: #fff;
      text-shadow: 0 0 40px rgba(255, 77, 109, 0.4);
      line-height: 1.1;
    }
    h1 .highlight {
      color: #ff8aa8;
    }
    .subhead {
      color: #d4b0bc;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 2px;
      margin-top: -4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .subhead span {
      color: #ff8aa8;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff4d6d, #d81b60);
      border: none;
      color: white;
      padding: 16px 36px;
      border-radius: 60px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 12px 35px rgba(255, 77, 109, 0.35);
      letter-spacing: 0.5px;
      margin: 8px 0 12px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
      transform: rotate(25deg);
    }
    .btn-primary:active::after {
      opacity: 1;
    }
    .btn-primary:active {
      transform: scale(0.94);
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
    }

    /* ——— MESSAGE / POEM ——— */
    #message-box {
      display: none;
      margin-top: 20px;
      animation: fadeUp 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .poem-container {
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 28px;
      padding: 24px 22px;
      border-left: 4px solid #ff4d6d;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      margin: 6px 0 14px;
    }
    .poem-line {
      font-size: 16.5px;
      line-height: 2;
      color: #f0e6ea;
      font-weight: 400;
      opacity: 0;
      transform: translateY(8px);
      animation: typeIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    .poem-line strong {
      color: #ff8aa8;
      font-weight: 700;
    }
    .poem-line .nick {
      color: #ffb3c6;
      font-weight: 600;
    }
    @keyframes typeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .signature {
      text-align: right;
      font-family: 'Great Vibes', cursive;
      font-size: 26px;
      color: #ff8aa8;
      margin-top: 6px;
      padding-right: 6px;
      text-shadow: 0 0 20px rgba(255, 77, 109, 0.3);
      opacity: 0;
      animation: typeIn 0.8s ease 1.2s forwards;
    }

    /* ——— INTERACTIVE BONUS ——— */
    .bonus-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .bonus-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f0e6ea;
      padding: 10px 22px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(4px);
      letter-spacing: 0.5px;
      flex: 1;
      min-width: 100px;
    }
    .bonus-btn:active {
      transform: scale(0.92);
      background: rgba(255, 77, 109, 0.2);
      border-color: #ff4d6d;
    }

    /* ——— FLOATING EMOJI EXPLOSION ——— */
    .float-emoji {
      position: fixed;
      pointer-events: none;
      font-size: 32px;
      z-index: 999;
      animation: emojiRise 2.6s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
      will-change: transform, opacity;
    }
    @keyframes emojiRise {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.6) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-320px) scale(0.2) rotate(60deg);
      }
    }

    /* ——— RESPONSIVE ——— */
    @media (max-width: 480px) {
      h1 {
        font-size: 38px;
      }
      .gift-box {
        width: 120px;
        height: 120px;
      }
      .gift-box .lid {
        top: -26px;
        left: -6px;
        height: 32px;
        width: calc(100% + 12px);
      }
      .gift-box .bow {
        font-size: 34px;
        top: -40px;
      }
      .gift-box .ribbon-v {
        width: 14px;
      }
      .gift-box .ribbon-h {
        height: 14px;
      }
      #main-card {
        padding: 24px 18px 30px;
        border-radius: 36px;
      }
      .poem-line {
        font-size: 15px;
        line-height: 1.9;
      }
      .poem-container {
        padding: 18px 16px;
      }
      .badge-day {
        font-size: 11px;
        padding: 4px 16px;
      }
      .btn-primary {
        font-size: 15px;
        padding: 14px 24px;
      }
      .bonus-btn {
        font-size: 13px;
        padding: 8px 14px;
        min-width: 70px;
      }
      .tap-text {
        font-size: 14px;
        padding: 10px 22px;
      }
    }
    @media (max-width: 380px) {
      h1 {
        font-size: 30px;
      }
      .gift-box {
        width: 100px;
        height: 100px;
      }
      .gift-box .lid {
        top: -22px;
        height: 28px;
      }
      .gift-box .bow {
        font-size: 28px;
        top: -34px;
      }
      .poem-line {
        font-size: 13.5px;
      }
    }

    /* ——— UTILITY ——— */
    .text-center {
      text-align: center;
    }
    .mt-1 {
      margin-top: 6px;
    }
    .mb-1 {
      margin-bottom: 6px;
    }
    .hidden {
      display: none !important;
    }
    .glow-text {
      text-shadow: 0 0 30px rgba(255, 77, 109, 0.3);
    }
  </style>
</head>
<body>

  <!-- ===== 3D CANVAS (background) ===== -->
  <div id="canvas-container"></div>

  <!-- ===== LANDING GIFT ===== -->
  <div id="landing">
    <div class="gift-wrapper" onclick="openGift()">
      <div class="gift-box" id="giftBox">
        <div class="box-body">
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
          <div class="shine"></div>
        </div>
        <div class="lid"></div>
        <div class="bow">🎀</div>
      </div>
    </div>
    <div class="tap-text">💝 Tap the gift, <span style="color:#ff8aa8;">mon Cherry</span></div>
  </div>

  <!-- ===== UI OVERLAY ===== -->
  <div id="ui-overlay">
    <!-- ===== MAIN CARD ===== -->
    <div id="main-card">
      <div class="card-header">
        <div class="badge-day">🌸 pour toi, mon amour</div>
        <h1>For <span class="highlight">Cherry</span></h1>
        <div class="subhead">my <span>baby</span> · my <span>peace</span> · my <span>everything</span></div>
      </div>

      <button class="btn-primary" id="revealBtn">💌 Read your letter, baby</button>

      <div id="message-box">
        <div class="poem-container" id="poemContainer">
          <!-- lines injected by JS -->
        </div>
        <div class="signature">— Manu</div>
      </div>

      <div class="bonus-row">
        <button class="bonus-btn" onclick="spawnEmojiBurst('💋', 18)">💋 Send a kiss</button>
        <button class="bonus-btn" onclick="spawnEmojiBurst('🤗', 16)">🤗 Virtual hug</button>
        <button class="bonus-btn" onclick="spawnEmojiBurst('✨', 22)">✨ Sparkle</button>
      </div>
    </div>
  </div>

  <!-- ===== THREE.JS ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
  </script>

  <script>
    // =============================================
    // 1. THREE.JS — 3D floating glass hearts
    // =============================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x12080c);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;
    container.appendChild(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);
    const light1 = new THREE.PointLight(0xff4d6d, 1.6, 25);
    light1.position.set(5, 5, 5);
    scene.add(light1);
    const light2 = new THREE.PointLight(0x6c4dff, 1.2, 25);
    light2.position.set(-5, -2, 6);
    scene.add(light2);
    const back = new THREE.DirectionalLight(0xffffff, 0.5);
    back.position.set(0, 0, -6);
    scene.add(back);

    function heartShape() {
      const s = new THREE.Shape();
      s.moveTo(0, 0.3);
      s.bezierCurveTo(0.3, 0.6, 0.6, 0.2, 0, -0.1);
      s.bezierCurveTo(-0.6, 0.2, -0.3, 0.6, 0, 0.3);
      return s;
    }

    function createHeart(color, size, x, y, z) {
      const geo = new THREE.ExtrudeGeometry(heartShape(), {
        steps: 1,
        depth: 0.2,
        bevelEnabled: true,
        bevelThickness: 0.08,
        bevelSize: 0.04
      });
      const mat = new THREE.MeshPhysicalMaterial({
        color: color,
        metalness: 0.15,
        roughness: 0.1,
        clearcoat: 0.9,
        clearcoatRoughness: 0.15,
        transparent: true,
        opacity: 0.7 + Math.random() * 0.25,
        emissive: color,
        emissiveIntensity: 0.06,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.scale.set(size, size, size);
      mesh.rotation.x = Math.random() * Math.PI;
      mesh.rotation.y = Math.random() * Math.PI;
      return mesh;
    }

    const heartData = [];
    const cols = [0xff4d6d, 0xff8aa8, 0xf8a4b8, 0xffffff, 0x6c757d, 0xd81b60, 0xffb3c6];
    for (let i = 0; i < 70; i++) {
      const c = cols[Math.floor(Math.random() * cols.length)];
      const s = 0.12 + Math.random() * 0.32;
      const x = (Math.random() - 0.5) * 20;
      const y = (Math.random() - 0.5) * 14;
      const z = (Math.random() - 0.5) * 14 - 3;
      const mesh = createHeart(c, s, x, y, z);
      scene.add(mesh);
      heartData.push({
        mesh,
        rotX: (Math.random() - 0.5) * 0.025,
        rotY: (Math.random() - 0.5) * 0.025,
        rotZ: (Math.random() - 0.5) * 0.025,
        floatSpd: 0.15 + Math.random() * 0.35,
        floatAmp: 0.08 + Math.random() * 0.2,
        origY: y,
      });
    }

    // Mouse / gyro tilt
    let mouseX = 0,
      mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    window.addEventListener('deviceorientation', (e) => {
      if (e.gamma != null && e.beta != null) {
        mouseX = e.gamma / 40;
        mouseY = e.beta / 40;
      }
    });

    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;

      heartData.forEach(h => {
        h.mesh.rotation.x += h.rotX;
        h.mesh.rotation.y += h.rotY;
        h.mesh.rotation.z += h.rotZ;
        h.mesh.position.y = h.origY + Math.sin(time * h.floatSpd) * h.floatAmp;
      });

      const baseX = Math.sin(time * 0.06) * 1.0;
      const baseY = Math.sin(time * 0.04) * 0.5;
      camera.position.x = baseX + mouseX * 1.8;
      camera.position.y = baseY + mouseY * 1.4;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =============================================
    // 2. UI LOGIC
    // =============================================
    const landing = document.getElementById('landing');
    const mainCard = document.getElementById('main-card');
    const messageBox = document.getElementById('message-box');
    const poemContainer = document.getElementById('poemContainer');
    const revealBtn = document.getElementById('revealBtn');
    let isOpen = false;

    // Casual, personal poem with nicknames
    const poemLines = [
      `Hey <span class="nick">baby</span>,`,
      `I don't have perfect words, but I know exactly how I feel.`,
      `Somehow, <strong>we merged souls from miles away</strong>,`,
      `and <strong>magically, we found our way together</strong>.`,
      `<span class="nick">Mon Cherry</span>, you make my world brighter without even trying.`,
      `I love the way you laugh, the way you think, the way you care.`,
      `Even when we're apart, I carry you with me — always.`,
      `You're my peace, my chaos, and my favorite person.`,
      `Just wanted you to know, today and every day,`,
      `you're so incredibly special to me. 🥺❤️`
    ];

    function buildPoem() {
      poemContainer.innerHTML = '';
      poemLines.forEach((line, i) => {
        const div = document.createElement('div');
        div.className = 'poem-line';
        div.innerHTML = line;
        div.style.animationDelay = (i * 0.12) + 's';
        poemContainer.appendChild(div);
      });
    }

    function revealMessage() {
      if (isOpen) return;
      isOpen = true;
      messageBox.style.display = 'block';
      buildPoem();
      // Spawn heart burst
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const x = Math.random() * window.innerWidth;
          const y = Math.random() * window.innerHeight;
          spawnEmoji('❤️', x, y, 24 + Math.random() * 30);
        }, i * 40);
      }
      revealBtn.textContent = '💖 She read it!';
      revealBtn.style.opacity = '0.6';
      revealBtn.style.pointerEvents = 'none';
    }

    function openGift() {
      // Animate lid opening
      const lid = document.querySelector('.lid');
      if (lid) {
        lid.style.transform = 'rotateX(-110deg)';
        setTimeout(() => {
          lid.style.transform = 'rotateX(-110deg) translateY(-10px)';
        }, 100);
      }
      // Hide landing after animation
      setTimeout(() => {
        landing.classList.add('hidden');
        mainCard.style.display = 'block';
        // Explosion of emojis
        for (let i = 0; i < 40; i++) {
          setTimeout(() => {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            const emojis = ['❤️', '💗', '💖', '🌸', '✨', '💕', '🎀'];
            spawnEmoji(emojis[Math.floor(Math.random() * emojis.length)], x, y, 26 + Math.random() * 34);
          }, i * 30);
        }
      }, 550);
    }

    // Reveal button listener
    revealBtn.addEventListener('click', revealMessage);

    // =============================================
    // 3. EMOJI BURST (tap anywhere + bonus buttons)
    // =============================================
    function spawnEmoji(emoji, x, y, size) {
      const el = document.createElement('div');
      el.className = 'float-emoji';
      el.textContent = emoji;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.fontSize = (size || 32) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }

    function spawnEmojiBurst(emoji, count = 20) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const x = Math.random() * window.innerWidth;
          const y = Math.random() * window.innerHeight;
          spawnEmoji(emoji, x, y, 22 + Math.random() * 32);
        }, i * 30);
      }
    }

    // Tap anywhere on screen → spawn hearts (but not on buttons to avoid double)
    document.addEventListener('click', (e) => {
      // ignore if click is on a button or inside main card (to prevent spam)
      const target = e.target;
      if (target.closest('button') || target.closest('#main-card') || target.closest('#landing')) return;
      spawnEmoji('💗', e.clientX, e.clientY, 26 + Math.random() * 28);
    });
    document.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      if (target && (target.closest('button') || target.closest('#main-card') || target.closest('#landing'))) return;
      spawnEmoji('💗', touch.clientX, touch.clientY, 26 + Math.random() * 28);
    }, { passive: true });

    // =============================================
    // 4. PARALLAX TILT ON CARD (mouse / gyro)
    // =============================================
    const card = document.getElementById('main-card');

    function applyTilt(x, y) {
      if (!card || card.style.display === 'none') return;
      const rotX = y * 4;
      const rotY = x * -4;
      card.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = -(e.clientY / window.innerHeight) * 2 + 1;
      applyTilt(x, y);
    });

    window.addEventListener('deviceorientation', (e) => {
      if (e.gamma != null && e.beta != null) {
        const x = e.gamma / 40;
        const y = e.beta / 40;
        applyTilt(x, y);
      }
    });

    // Reset tilt on leave
    document.addEventListener('mouseleave', () => {
      if (card) card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    });

    console.log('🌸 For Cherry — with love, Manu');
  </script>
</body>
